name: Marketplace security and integration checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deploy-safe source
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit
      - name: Check JavaScript syntax before release
        run: |
          node --check server.js
          node --check email-delivery.js
          node --check email-otp.js
          node --check public/account/account.js
          node --check public/app.js
          node --check public/shop.js
          node --check public/shop-studio-v8.js
      - name: Run unit and security regression tests
        run: npm test
      - name: Source must not contain runtime secrets
        shell: bash
        run: |
          if grep -rE --include='*.js' --include='*.html' --include='*.env'             '(sk_live_[0-9A-Za-z]{12,}|sk_test_[0-9A-Za-z]{12,}|whsec_[0-9A-Za-z]{12,}|re_[0-9A-Za-z]{20,})' public/ tests/ .env.example 2>/dev/null; then
            echo 'Potential secret exposed in public source'
            exit 1
          fi
          if find public -type f \( -name '*.lua' -o -name '*.sealed' -o -name '*.exe' \) | grep -q .; then
            echo 'Private payload present in web-served public folder'
            exit 1
          fi

  database-migration:
    name: PostgreSQL migration integration (disposable databases)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgres://postgres:migration-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit
      - name: Verify atomic Neon transfer and rollback with real PostgreSQL
        run: node --test tests/neon-migration.integration.test.js
