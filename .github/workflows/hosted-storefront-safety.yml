name: Hosted storefront checkout safety smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check public store, no-charge safety gates and protected routes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://zebra-bl-marketplace.onrender.com';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function request(path,options={}){
            let last;
            for(let attempt=0;attempt<3;attempt++){
              try{
                const response=await fetch(origin+path,{
                  ...options,redirect:'manual',signal:AbortSignal.timeout(25000),
                  headers:{Accept:'application/json',...(options.headers||{})}
                });
                let json=null;
                if((response.headers.get('content-type')||'').includes('application/json')){
                  json=await response.json();
                }
                return {status:response.status,json};
              }catch(error){last=error;if(attempt<2)await sleep(5000);}
            }
            throw new Error('Hosted app unreachable: '+(last?.name||'network_error'));
          }
          const health=await request('/api/health');
          assert.equal(health.status,200,'Health endpoint did not respond');
          const h=health.json;
          assert.equal(h?.service,'zebra-store');
          assert.equal(h?.postgres_ready,true,'Persistent DB connection missing');
          // A revoked/malformed key must fail closed. The webhook readiness
          // assertion is required only when the server has a configured
          // payment mode or if the shop claims Checkout is available.
          assert.ok(['test','live','unconfigured'].includes(h?.mode),'Unknown payment mode');
          assert.equal(h?.verified_script_count,6,'Sealed script integrity check failed');
          const store=await request('/api/store');
          assert.equal(store.status,200,'Catalog endpoint did not respond');
          assert.ok(Array.isArray(store.json?.catalog?.products));
          assert.equal(typeof store.json.checkout_ready,'boolean');
          assert.equal(store.json.mode,h.mode,'Payment modes disagree');
          if(h.mode==='unconfigured'){
            assert.equal(store.json.checkout_ready,false,'Unconfigured Stripe key must not allow charges');
            assert.equal(h.stripe_api_ready,false,'Unconfigured Stripe key unexpectedly authenticated');
          }else{
            assert.equal(h.webhook_configured,true,'Stripe webhook signature secret missing');
          }
          if(store.json.checkout_ready){
            assert.equal(h.webhook_configured,true,'Checkout cannot open without a webhook signing secret');
            assert.equal(h.stripe_api_ready,true,'Checkout cannot open with unauthorized Stripe key');
          }
          if(h.mode==='live'&&store.json.checkout_ready){
            assert.equal(h.live_merchant_ready,true,'Live checkout active without verified merchant');
            assert.equal(h.stripe_api_ready,true,'Live checkout active without verified Stripe key');
          }
          if(h.mode==='test'){
            assert.equal(store.json.checkout_ready,false,'Anonymous visitors must not purchase in sandbox');
          }
          const blocked=await request('/api/loader/str-grinder?key=ZBL_'+'0'.repeat(56));
          assert.equal(blocked.status,403,'Unpaid license unexpectedly accessed');
          const installer=await request('/api/injector/download');
          assert.equal(installer.status,401,'Anonymous visitor accessed protected installer');
          const checkout=await request('/api/checkout',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sku:'str-grinder',accepted_terms:true})
          });
          assert.equal(checkout.status,401,'Anonymous visitor bypassed authenticated checkout');
          const summary=[
            '### Hosted store smoke check',
            '- Mode: '+h.mode,
            '- Public checkout: '+(store.json.checkout_ready?'available':'restricted'),
            '- Stripe key authorized: '+String(h.stripe_api_ready),
            '- Signed webhooks configured: '+String(h.webhook_configured),
            '- Six protected Lua payloads verified: yes',
            '- Unpaid payload/installer denied: yes',
            '- Anonymous paid checkout denied: yes',
            '- Real payment was NOT attempted'
          ].join('\n');
          console.log(summary);
          if(process.env.GITHUB_STEP_SUMMARY){
            const {appendFileSync}=await import('node:fs');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n');
          }
          NODE
