name: Zebra owned chat live smoke test
on:
  push:
    paths:
      - .github/workflows/zebra-chat-smoke.yml
permissions:
  contents: read
jobs:
  live-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public pages contain Zebra widget and no tawk embed
        shell: bash
        run: |
          set -euo pipefail
          base=https://zebra-bl-marketplace.onrender.com
          for route in / /scripts/ /account/ /zflag/ /support/ /privacy/ /terms/; do
            curl -fsSL --retry 2 --max-time 45 "$base$route" -o /tmp/zebra-shop.html
            grep -q 'zebra-support-chat.js?v=20261121v1' /tmp/zebra-shop.html
            if grep -E 'src="/tawk-chat.js"|embed.tawk.to' /tmp/zebra-shop.html; then
              echo "Unexpected third-party chat embed on $route"
              exit 1
            fi
          done
          curl -fsSL --max-time 45 "$base/zebra-support-chat.js?v=20261121v1" -o /tmp/zebra-chat.js
          grep -q 'zebra-owned-chat' /tmp/zebra-chat.js
          curl -fsSL --max-time 45 "$base/support/inbox/" -o /tmp/zebra-inbox.html
          grep -q 'Private Inbox' /tmp/zebra-inbox.html
      - name: Verify real hosted chat handles first-party conversations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://zebra-bl-marketplace.onrender.com';
          const request=async(path,options={})=>{
            const response=await fetch(base+path,{
              ...options,
              headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...options.headers}
            });
            const data=await response.json();
            return {status:response.status,data};
          };
          const created=await request('/api/zebra-chat/start',{method:'POST',body:'{}'});
          assert.equal(created.status,201);
          const {id,token}=created.data;
          assert.ok(id&&token);
          const wrong=await request('/api/zebra-chat/'+id,{headers:{'X-Zebra-Chat-Token':'0'.repeat(64)}});
          assert.equal(wrong.status,403);
          const message=await request('/api/zebra-chat/'+id+'/message',{
            method:'POST',
            headers:{'X-Zebra-Chat-Token':token},
            body:JSON.stringify({message:'Where can I find my sandbox purchase in My Library?'})
          });
          assert.equal(message.status,200);
          const thread=await request('/api/zebra-chat/'+id,{headers:{'X-Zebra-Chat-Token':token}});
          assert.equal(thread.status,200);
          assert.ok(thread.data.messages.some(m=>m.sender==='assistant'&&m.text.includes('/account/')));
          console.log('Zebra chat public API and FAQ passed live test:',id.slice(0,8));
          NODE
